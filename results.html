<style>
html,body{margin:0;padding:0;background:#f1f5f9;}

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap');

:root{
  --white:#ffffff;
  --base:#f1f5f9;
  --subtle:#f8f9fb;
  --base-hover:#e2ebf3;
  --primary:#20667e;
  --primary-hover:#277996;
  --primary-subtle:rgba(39,121,150,0.06);
  --primary-subtle-2:rgba(39,121,150,0.12);
  --marine-400:#51b0d2;
  --marine-900:#194a62;
  --t-primary:#1e293b;
  --t-secondary:#334155;
  --t-tertiary:#475569;
  --t-quaternary:#64748b;
  --t-placeholder:#7b8ba3;
  --t-disabled:#b5c3d4;
  --b-primary:#e2ebf3;
  --b-secondary:#d3dce8;
  --teal:#00fff6;
  --success:#1a8962;
  --warning:#db4d00;
  --error:#c71c22;
  --grad-dark:linear-gradient(98deg,#0F486D 1.78%,#031734 98.35%);
  --grad-teal:linear-gradient(95deg,#00FFDE -11.43%,#00F0FF 98.96%);
  --r-sm:4px; --r-md:8px; --r-lg:12px;
}

*{box-sizing:border-box;}
.by-app{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--t-secondary);
  background:var(--base);
  border-radius:var(--r-lg);
  overflow:hidden;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.by-app p{margin:0;}

/* ---------- top bar ---------- */
.topbar{
  background:var(--white);
  border-bottom:1px solid var(--b-primary);
  padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.logo-wrap{padding:6px 0;}
.logo-wrap img{height:34px;width:auto;display:block;}
.tabs{display:flex;gap:4px;background:var(--base);padding:4px;border-radius:var(--r-md);}
.tab{
  font-family:inherit;font-size:13px;line-height:20px;font-weight:600;
  padding:7px 14px;border:none;border-radius:6px;background:transparent;
  color:var(--t-quaternary);cursor:pointer;transition:.15s;
}
.tab:hover:not(:disabled){color:var(--primary);}
.tab.active{background:var(--white);color:var(--primary);box-shadow:0 1px 2px rgba(30,41,59,.08);}
.tab:disabled{color:var(--t-disabled);cursor:not-allowed;}

/* ---------- shell ---------- */
.shell{padding:24px;max-width:940px;margin:0 auto;}
.card{
  background:var(--white);border:1px solid var(--b-primary);
  border-radius:var(--r-lg);padding:28px;margin-bottom:16px;
}
.card.flush{padding:0;overflow:hidden;}

/* ---------- dark hero ---------- */
.hero{
  background:var(--grad-dark);border-radius:var(--r-lg);
  padding:36px 32px;margin-bottom:16px;color:#fff;
}
.hero .eyebrow{
  font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--teal);margin-bottom:12px;
}
.hero h1{
  font-size:32px;line-height:40px;font-weight:600;color:#fff;margin:0 0 12px;
}
.hero p{font-size:16px;line-height:24px;font-weight:500;color:rgba(255,255,255,.86);max-width:62ch;}
.arrows{color:var(--teal);font-size:13px;letter-spacing:.35em;margin-bottom:16px;}

/* ---------- typography ---------- */
.h-step{font-size:22px;line-height:30px;font-weight:600;color:var(--t-primary);margin:0 0 6px;}
.sub{font-size:14px;line-height:20px;color:var(--t-tertiary);margin:0 0 22px;max-width:70ch;}
.label{
  font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--t-placeholder);margin-bottom:8px;display:block;
}
.h-sec{font-size:16px;line-height:24px;font-weight:600;color:var(--t-primary);margin:0 0 4px;}
.note{font-size:12px;line-height:18px;color:var(--t-quaternary);}

/* ---------- progress ---------- */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.ptrack{flex:1;height:6px;background:var(--b-primary);border-radius:999px;overflow:hidden;}
.pfill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s;}
.pnum{font-size:12px;font-weight:600;color:var(--t-quaternary);white-space:nowrap;}

/* ---------- inputs ---------- */
.field{margin-bottom:20px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
input[type=text],select,textarea{
  font-family:inherit;font-size:14px;line-height:20px;color:var(--t-secondary);
  width:100%;padding:10px 12px;border:1px solid var(--b-primary);
  border-radius:var(--r-md);background:var(--white);outline:none;transition:.15s;
}
textarea{resize:vertical;min-height:76px;}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-subtle-2);}
::placeholder{color:var(--t-disabled);}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  font-family:inherit;font-size:13px;line-height:20px;font-weight:500;
  padding:8px 14px;border:1px solid var(--b-secondary);border-radius:999px;
  background:var(--white);color:var(--t-secondary);cursor:pointer;transition:.15s;
}
.chip:hover{border-color:var(--primary);color:var(--primary);}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.chip:disabled{opacity:.4;cursor:not-allowed;}
.chip:disabled:hover{border-color:var(--b-secondary);color:var(--t-secondary);}
.counter{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  padding:6px 12px;border-radius:999px;background:var(--primary-subtle);color:var(--primary);
}
.counter.done{background:rgba(50,195,143,.13);color:var(--success);}

/* ---------- sliders ---------- */
.dial{padding:18px 0;border-bottom:1px solid var(--b-primary);}
.dial:last-child{border-bottom:none;}
.dial-ends{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;}
.dial-end{font-size:13px;line-height:18px;font-weight:600;color:var(--t-secondary);max-width:42%;}
.dial-end.r{text-align:right;}
.dial-end span{display:block;font-size:11px;font-weight:400;color:var(--t-placeholder);margin-top:2px;}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;
  background:var(--b-primary);outline:none;margin:6px 0 4px;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--primary);border:3px solid #fff;box-shadow:0 1px 5px rgba(30,41,59,.28);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--primary);
  border:3px solid #fff;box-shadow:0 1px 5px rgba(30,41,59,.28);cursor:pointer;
}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--t-disabled);font-weight:500;}
.untouched input[type=range]::-webkit-slider-thumb{background:var(--t-disabled);}
.untouched input[type=range]::-moz-range-thumb{background:var(--t-disabled);}

/* ---------- archetype cards ---------- */
.arch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.arch{
  text-align:left;font-family:inherit;padding:14px 16px;border-radius:var(--r-lg);
  border:1px solid var(--b-primary);background:var(--white);cursor:pointer;transition:.15s;
}
.arch:hover{border-color:var(--primary);}
.arch strong{display:block;font-size:14px;line-height:20px;font-weight:600;color:var(--t-primary);margin-bottom:2px;}
.arch em{font-style:normal;font-size:12px;line-height:17px;color:var(--t-quaternary);}
.arch.p1{border-color:var(--primary);background:var(--primary-subtle);box-shadow:inset 0 0 0 1px var(--primary);}
.arch.p2{border-color:var(--marine-400);background:var(--primary-subtle);}
.pill{
  display:inline-block;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;margin-bottom:6px;
}
.pill.a{background:var(--primary);color:#fff;}
.pill.b{background:var(--marine-400);color:#fff;}

/* ---------- buttons ---------- */
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;}
.btn{
  font-family:inherit;font-size:14px;line-height:20px;font-weight:600;
  padding:11px 22px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:.15s;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-hover);}
.btn-primary:disabled{background:var(--t-disabled);cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--primary);border-color:var(--b-secondary);}
.btn-ghost:hover{border-color:var(--primary);background:var(--primary-subtle);}
.btn-teal{background:var(--grad-teal);color:var(--t-primary);font-weight:600;}
.btn-sm{font-size:12px;padding:7px 14px;}
.btn-danger{background:transparent;color:var(--error);border-color:rgba(199,28,34,.3);}
.btn-danger:hover{background:#fef1f1;}

/* ---------- dashboard ---------- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.stat{background:var(--white);border:1px solid var(--b-primary);border-radius:var(--r-lg);padding:18px 20px;}
.stat .n{font-size:34px;line-height:40px;font-weight:600;color:var(--primary);}
.stat .l{font-size:12px;line-height:16px;font-weight:600;color:var(--t-placeholder);text-transform:uppercase;letter-spacing:.05em;}

.bar-row{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:12px;margin-bottom:7px;}
.bar-name{font-size:13px;line-height:18px;font-weight:500;color:var(--t-secondary);text-align:right;}
.bar-row.top .bar-name{font-weight:600;color:var(--t-primary);}
.bar-track{height:20px;background:var(--base);border-radius:var(--r-sm);overflow:hidden;}
.bar-fill{height:100%;background:var(--b-secondary);border-radius:var(--r-sm);transition:width .5s;}
.bar-row.top .bar-fill{background:var(--primary);}
.bar-val{font-size:12px;font-weight:600;color:var(--t-quaternary);}

.res-dial{padding:16px 0;border-bottom:1px solid var(--b-primary);}
.res-dial:last-child{border-bottom:none;}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
.res-head b{font-size:13px;font-weight:600;color:var(--t-secondary);}
.badge{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.badge.aligned{background:rgba(50,195,143,.13);color:var(--success);}
.badge.mixed{background:rgba(247,142,30,.12);color:var(--warning);}
.badge.split{background:#feeced;color:var(--error);}
.plot{position:relative;height:34px;background:var(--base);border-radius:var(--r-sm);margin:0 0 6px;}
.plot .mid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--b-secondary);}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--marine-400);opacity:.75;transform:translate(-50%,-50%);}
.mean{position:absolute;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--primary);transform:translateX(-50%);}
.mean-lab{position:absolute;top:-16px;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--primary);white-space:nowrap;}
.plot-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--t-quaternary);font-weight:500;}

.quote{
  border-left:3px solid var(--marine-400);background:var(--subtle);
  padding:12px 16px;border-radius:0 var(--r-md) var(--r-md) 0;margin-bottom:8px;
}
.quote p{font-size:14px;line-height:21px;color:var(--t-secondary);}
.quote .who{font-size:11px;font-weight:600;color:var(--t-placeholder);margin-top:6px;text-transform:uppercase;letter-spacing:.04em;}
.isnot{display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;}
.isnot .is{font-weight:600;color:var(--primary);}
.isnot .no{font-weight:600;color:var(--t-placeholder);text-decoration:line-through;}

.callout{
  background:var(--primary-subtle);border:1px solid var(--primary-subtle-2);
  border-radius:var(--r-md);padding:14px 16px;margin-bottom:16px;
}
.callout .label{margin-bottom:6px;color:var(--primary);}
.callout p{font-size:13px;line-height:20px;color:var(--t-tertiary);}

.empty{text-align:center;padding:56px 24px;color:var(--t-placeholder);}
.empty .big{font-size:15px;font-weight:600;color:var(--t-tertiary);margin-bottom:6px;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.spacer{flex:1;}
.warn{
  background:rgba(247,142,30,.12);border:1px solid rgba(219,77,0,.3);color:#8a3500;
  padding:10px 14px;border-radius:var(--r-md);font-size:13px;line-height:19px;margin-bottom:14px;
}
.review-tbl{width:100%;border-collapse:collapse;}
.review-tbl td{padding:8px 0;border-bottom:1px solid var(--b-primary);font-size:13px;line-height:19px;vertical-align:top;}
.review-tbl td:first-child{color:var(--t-placeholder);font-weight:600;width:190px;padding-right:16px;}
.review-tbl tr:last-child td{border-bottom:none;}

/* ---------- archetype groups ---------- */
.arch-grid{grid-template-columns:repeat(3,1fr);}
.qgroup{margin-bottom:22px;}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qhead b{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t-secondary);}
.qhead i{font-style:normal;font-size:12px;color:var(--t-placeholder);}
.qdot{width:9px;height:9px;border-radius:50%;flex:none;}
.qdot.q0{background:var(--primary);} .qdot.q1{background:var(--marine-400);}
.qdot.q2{background:#756051;} .qdot.q3{background:var(--t-quaternary);}
.arch .drv{
  display:block;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--primary);margin:0 0 5px;
}

/* ---------- story ---------- */
.story-open h1{letter-spacing:-.01em;}
.story-panel{background:var(--grad-dark);border-radius:var(--r-lg);padding:28px 24px 24px;margin-bottom:16px;}
.panel-h{font-size:18px;line-height:26px;font-weight:600;color:#fff;margin:0 0 6px;}
.panel-sub{font-size:13px;line-height:20px;font-weight:500;color:rgba(255,255,255,.62);margin:0 0 8px;max-width:64ch;}
.wheel-key{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.wheel-key span{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;color:rgba(255,255,255,.6);}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;}
.sw.teal{background:var(--teal);} .sw.blue{background:rgba(81,176,210,.92);}
.sw.faint{background:rgba(81,176,210,.28);}

.narrative p{font-size:16px;line-height:27px;color:var(--t-secondary);margin-bottom:14px;}
.narrative p:last-child{margin-bottom:0;}
.narrative b{color:var(--t-primary);font-weight:600;}
.narrative em{color:var(--t-tertiary);}
.narrative .strike{text-decoration:line-through;color:var(--t-placeholder);font-weight:600;}

.tension{
  background:var(--white);border:1px solid rgba(219,77,0,.28);border-left:4px solid var(--warning);
  border-radius:var(--r-lg);padding:24px 26px;margin-bottom:16px;
}
.tension p{font-size:14px;line-height:22px;color:var(--t-tertiary);}
.vs{display:flex;align-items:center;gap:18px;margin:14px 0 18px;flex-wrap:wrap;}
.vs-side{flex:1;min-width:150px;}
.vs-l{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t-placeholder);margin-bottom:4px;}
.vs-side strong{display:block;font-size:22px;line-height:28px;font-weight:600;color:var(--t-primary);}
.vs-side em{font-style:normal;font-size:12px;color:var(--primary);font-weight:600;}
.vs-mid{font-size:12px;font-weight:600;color:var(--t-disabled);text-transform:uppercase;letter-spacing:.08em;}

.bchips{display:flex;flex-wrap:wrap;gap:8px;}
.bchip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
  border:1px solid var(--b-primary);border-radius:999px;background:var(--subtle);
}
.bchip b{font-size:13px;font-weight:600;color:var(--t-secondary);}
.bchip i{font-style:normal;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--primary);}
.bchip u{
  text-decoration:none;font-size:11px;font-weight:600;color:#fff;background:var(--primary);
  min-width:19px;height:19px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
}

.charcard{background:var(--grad-dark);border-radius:var(--r-lg);padding:30px 32px;margin-bottom:16px;}
.cc-eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:14px;}
.cc-arch{font-size:40px;line-height:46px;font-weight:600;color:#fff;margin-bottom:22px;}
.cc-arch span{color:rgba(255,255,255,.42);font-weight:600;}
.cc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.cc-l{display:block;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:5px;}
.cc-grid p{font-size:15px;line-height:22px;font-weight:600;color:#fff;}

@media(max-width:860px){
  .arch-grid{grid-template-columns:repeat(2,1fr);}
  .cc-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:720px){
  .grid2,.arch-grid{grid-template-columns:1fr;}
  .cc-arch{font-size:30px;line-height:36px;}
  .vs-mid{display:none;}
  .stat-row{grid-template-columns:1fr;}
  .bar-row{grid-template-columns:110px 1fr 40px;}
  .shell{padding:16px;}
  .card,.hero{padding:20px;}
}

/* ---------- data source panel ---------- */
.srcpanel{background:var(--white);border:1px solid var(--b-primary);border-radius:var(--r-lg);padding:24px 26px;margin-bottom:16px;}
.srcpanel h3{font-size:17px;line-height:24px;font-weight:600;color:var(--t-primary);margin:0 0 6px;}
.srcpanel p{font-size:13px;line-height:20px;color:var(--t-tertiary);margin-bottom:16px;}
.managecard{padding:20px 24px;}
.manage-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.manage-toggle{font-size:13px;font-weight:600;color:var(--primary);}
.mlist{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
.mrow{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 14px;border:1px solid var(--b-primary);border-radius:var(--r-md);background:var(--subtle);
}
.mrow-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0;}
.mrow-main b{font-size:13.5px;font-weight:600;color:var(--t-primary);}
.mrow-team{font-size:12px;color:var(--t-quaternary);}
.mrow-time{font-size:11px;color:var(--t-disabled);}
.mrow-sub{flex:1;font-size:12px;color:var(--t-quaternary);padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mrow-nodel{font-size:11px;color:var(--t-disabled);font-style:italic;white-space:nowrap;}
.livebar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(50,195,143,.10);border:1px solid rgba(26,137,98,.25);
  color:var(--success);padding:9px 16px;border-radius:var(--r-md);margin-bottom:16px;
  font-size:12.5px;font-weight:600;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;background:var(--success);flex:none;
  box-shadow:0 0 0 0 rgba(26,137,98,.5); animation:livepulse 2s infinite;
}
@keyframes livepulse{
  0%{box-shadow:0 0 0 0 rgba(26,137,98,.45);}
  70%{box-shadow:0 0 0 6px rgba(26,137,98,0);}
  100%{box-shadow:0 0 0 0 rgba(26,137,98,0);}
}
.previewbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(247,142,30,.12);border:1px solid rgba(219,77,0,.3);
  color:#8a3500;padding:10px 16px;border-radius:var(--r-md);margin-bottom:16px;
  font-size:13px;line-height:19px;font-weight:600;
}
textarea.paste{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:96px;}

/* ---------- option grid ---------- */
.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.opt{background:var(--subtle);border-radius:var(--r-lg);padding:20px;}
.opt-n{display:inline-block;font-size:12px;font-weight:600;color:var(--primary);margin-bottom:6px;}
.opt b{display:block;font-size:14px;line-height:20px;font-weight:600;color:var(--t-primary);margin-bottom:5px;}
.opt p{font-size:12.5px;line-height:19px;color:var(--t-quaternary);margin-bottom:10px;}
.opt i{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
.opt i.ok{background:rgba(50,195,143,.13);color:var(--success);}
.opt i.no{background:#feeced;color:var(--error);}
.opt i.maybe{background:rgba(247,142,30,.12);color:var(--warning);}

/* ---------- comparison tables ---------- */
.cmp{width:100%;border-collapse:collapse;}
.cmp th{
  font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t-placeholder);
  text-align:left;padding:0 12px 8px 0;border-bottom:1px solid var(--b-secondary);
}
.cmp td{font-size:13px;line-height:19px;color:var(--t-tertiary);padding:11px 12px 11px 0;border-bottom:1px solid var(--b-primary);vertical-align:top;}
.cmp td:first-child{color:var(--t-placeholder);font-weight:600;width:180px;}
.cmp td.hi{color:var(--t-primary);font-weight:600;background:var(--primary-subtle);}
.cmp tr:last-child td{border-bottom:none;}

/* ---------- specimen ---------- */
.fbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.fbtn{
  font-family:inherit;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;
  border:1px solid var(--b-secondary);background:var(--white);color:var(--t-tertiary);cursor:pointer;transition:.15s;
}
.fbtn:hover{border-color:var(--primary);color:var(--primary);}
.fbtn.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.fnote{font-size:12.5px;line-height:19px;color:var(--t-quaternary);margin-bottom:16px;}
.spec{border:1px solid var(--b-primary);border-radius:var(--r-lg);padding:24px;background:var(--white);}
.spec-ol{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t-placeholder);margin-bottom:6px;}
.spec-h1{font-size:26px;line-height:32px;font-weight:600;color:var(--t-primary);margin-bottom:18px;}
.spec-row{display:flex;gap:34px;flex-wrap:wrap;margin-bottom:20px;}
.spec-l{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t-placeholder);margin-bottom:3px;}
.spec-kpi{font-size:30px;line-height:36px;font-weight:600;color:var(--t-primary);}
.spec-v{font-size:15px;line-height:24px;font-weight:500;color:var(--t-secondary);padding-top:5px;}
.spec-tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:rgba(39,121,150,.12);color:var(--primary);margin-top:6px;}
.spec-tbl{width:100%;border-collapse:collapse;margin-bottom:18px;}
.spec-tbl th{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--t-quaternary);text-align:left;padding:0 8px 7px 0;border-bottom:1px solid var(--b-primary);}
.spec-tbl td{font-size:12px;line-height:17px;color:var(--t-secondary);padding:9px 8px 9px 0;border-bottom:1px solid var(--b-primary);}
.spec-tbl .r{text-align:right;padding-right:0;font-variant-numeric:tabular-nums;}
.spec-body{font-size:13px;line-height:20px;color:var(--t-tertiary);margin-bottom:22px;max-width:64ch;}
.spec-wm{font-size:40px;line-height:46px;font-weight:600;letter-spacing:.02em;color:var(--primary);}
.spec-cap{font-size:11px;color:var(--t-disabled);margin-top:4px;}

/* ---------- direction card ---------- */
.dircard{background:var(--primary-subtle);border:1px solid var(--primary-subtle-2);border-radius:var(--r-lg);padding:20px 22px;}
.dir-h{font-size:19px;line-height:26px;font-weight:600;color:var(--t-primary);margin-bottom:8px;}
.dircard p{font-size:13.5px;line-height:21px;color:var(--t-tertiary);margin-bottom:10px;}
.dir-f{margin-bottom:0!important;color:var(--t-secondary)!important;}

/* ---------- recommendations ---------- */
.rec{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--b-primary);}
.rec:last-child{border-bottom:none;padding-bottom:0;}
.rec-n{
  flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.rec b{display:block;font-size:15px;line-height:22px;font-weight:600;color:var(--t-primary);margin-bottom:6px;}
.rec p{font-size:13.5px;line-height:21px;color:var(--t-tertiary);}

/* ---------- voice & tone ---------- */
.vt{padding:16px 0;border-bottom:1px solid var(--b-primary);}
.vt:last-child{border-bottom:none;padding-bottom:0;}
.vt b{display:block;font-size:15px;line-height:22px;font-weight:600;color:var(--t-primary);margin-bottom:5px;}
.vt p{font-size:13.5px;line-height:21px;color:var(--t-tertiary);margin-bottom:8px;}
.vt-t{background:var(--subtle);border-radius:var(--r-md);padding:10px 14px;margin-bottom:0!important;font-size:12.5px!important;}
.vt-t span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--primary);margin-bottom:3px;}

/* ---------- checklist ---------- */
.chk{margin:0;padding-left:20px;}
.chk li{font-size:13.5px;line-height:21px;color:var(--t-tertiary);margin-bottom:11px;}
.chk li b{color:var(--t-primary);font-weight:600;}
.chk code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--base);padding:1px 5px;border-radius:3px;}

@media(max-width:860px){
  .opt-grid{grid-template-columns:1fr;}
  .cmp td:first-child{width:120px;}
}

/* ---------- source steps ---------- */
.src-step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--b-primary);}
.src-step:last-child{border-bottom:none;padding-bottom:0;}
.src-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--primary-subtle-2);color:var(--primary);
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.src-step b{display:block;font-size:14px;font-weight:600;color:var(--t-primary);margin-bottom:3px;}
.src-step p{font-size:12.5px;line-height:19px;color:var(--t-quaternary);margin-bottom:10px;}
.okbar{display:flex;align-items:center;gap:10px;background:rgba(50,195,143,.13);border:1px solid rgba(26,137,98,.3);
  color:var(--success);padding:10px 16px;border-radius:var(--r-md);margin-bottom:16px;font-size:13px;font-weight:600;}

.by-app{border-radius:0;min-height:100vh;}

.gate{position:fixed;inset:0;background:linear-gradient(98deg,#0F486D 1.78%,#031734 98.35%);
  z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
.gate-card{background:#fff;border-radius:12px;padding:36px 34px;max-width:380px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.gate-card img{height:28px;margin-bottom:20px;display:block;}
.gate-card h2{font-size:19px;font-weight:600;color:#1E293B;margin:0 0 6px;}
.gate-card p{font-size:13px;line-height:19px;color:#64748b;margin-bottom:20px;}
.gate-card input{width:100%;padding:10px 12px;border:1px solid #d3dce8;border-radius:8px;
  font-size:14px;margin-bottom:10px;box-sizing:border-box;}
.gate-err{font-size:12.5px;color:#c71c22;font-weight:600;margin-bottom:10px;min-height:16px;}
.gate-card button{width:100%;font-family:inherit;font-size:14px;font-weight:600;padding:11px 22px;
  border-radius:9px;border:none;background:#20667e;color:#fff;cursor:pointer;}
.gate-card button:hover{background:#277996;}
</style>
</head>

<script>
(function(){
  var PW = "D3sign!";
  var KEY = "byBP2-gate-ok";
  function unlocked(){ try{ return sessionStorage.getItem(KEY) === "1"; }catch(e){ return false; } }
  function show(){
    var g = document.getElementById("byGate");

    g.style.display = unlocked() ? "none" : "flex";
    if(!unlocked()){ var pw = document.getElementById("gatePw"); if(pw) pw.focus(); }
  }
  window.byGateCheck = function(){
    var v = document.getElementById("gatePw").value;
    if(v === PW){
      try{ sessionStorage.setItem(KEY, "1"); }catch(e){}
      document.getElementById("byGate").style.display = "none";
    } else {
      document.getElementById("gateErr").textContent = "That's not it — try again.";
      document.getElementById("gatePw").value = "";
      document.getElementById("gatePw").focus();
    }
  };
  show();
})();

async function sGet(k, sh){ try{ const r = await window.storage.get(k, sh); return r? r.value : null; }catch(e){ return null; } }
async function sSet(k, v, sh){
  try{ const r = await window.storage.set(k, v, sh); if(!r) throw 0; return true; }
  catch(e){ storageOK=false; memStore[k]=v; return false; }
}
async function sList(p, sh){ try{ const r = await window.storage.list(p, sh); return (r && r.keys) ? r.keys : []; }catch(e){ return []; } }
async function sDel(k, sh){ try{ await window.storage.delete(k, sh); }catch(e){} }

async function loadAll(){
  loading = true; render();
  const keys = await sList(PREFIX, true);
  const out = [];
  for(let i=0;i<keys.length;i+=5){
    const batch = keys.slice(i,i+5).map(async k=>{
      const key = (typeof k === "string") ? k : (k && k.key);
      if(!key) return null;
      const v = await sGet(key, true);
      if(!v) return null;
      try{ return JSON.parse(v); }catch(e){ return null; }
    });
    (await Promise.all(batch)).forEach(x=>{ if(x) out.push(x); });

function sd(a){ if(a.length<2) return 0; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1)); }

  TONE.forEach((t,i)=>{ if(typeof a[5][i]==="number") r.tone[t.id]=a[5][i]; });
  return r;
}

function download(name, text, type){
  const b = new Blob([text], {type:type});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u), 1500);
}

function exportCSV(){

    .concat(TONE.map(t=>t.l+" > "+t.r))

   .concat(TONE.map(t=>r.tone?r.tone[t.id]:""))
   .concat([ archName(r.arch1), archName(r.arch2), (r.brands||[]).join("; "), r.brandOther||"",

/* ============================== ARCHETYPE MATHS ============================== */
function archScores(){
  const w = {}; ARCHETYPES.forEach(a=>w[a.id]={p:0,s:0,score:0});
  all.forEach(r=>{
    if(r.arch1&&w[r.arch1]){ w[r.arch1].p++; w[r.arch1].score+=2; }
    if(r.arch2&&w[r.arch2]){ w[r.arch2].s++; w[r.arch2].score+=1; }
  });
  return w;
}
function brandScores(){
  const w = {}; ARCHETYPES.forEach(a=>w[a.id]=0);
  all.forEach(r=>(r.brands||[]).forEach(bn=>{
    const b = BRANDS.find(x=>x.n===bn);
    if(b && w[b.a]!==undefined) w[b.a]++;
  }));
  return w;
}
function topOf(map, key){
  const arr = ARCHETYPES.map(a=>({a, v: key ? map[a.id][key] : map[a.id]}));
  arr.sort((x,y)=>y.v-x.v);
  return arr;
}
function band(v, list){ for(const [mx,t] of list){ if(v<=mx) return t; } return list[list.length-1][1]; }
function art(s){ return (/^[AEIOU]/i.test(s) ? "an " : "a ") + s; }


/* ============================== THE WHEEL ============================== */
function wheelSVG(scores, maxScore){
  const CX=280, CY=252, QR=68, R0=80, RMAX=168, LR=180;
  const rad = d => d*Math.PI/180;
  const pt = (r,d)=>[ (CX+r*Math.cos(rad(d))).toFixed(1), (CY+r*Math.sin(rad(d))).toFixed(1) ];
  function seg(r0,r1,a0,a1){
    const [x0,y0]=pt(r1,a0),[x1,y1]=pt(r1,a1),[x2,y2]=pt(r0,a1),[x3,y3]=pt(r0,a0);
    const laf=(a1-a0)>180?1:0;
    return `M${x0} ${y0}A${r1} ${r1} 0 ${laf} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${laf} 0 ${x3} ${y3}Z`;
  }
  const ranked = topOf(scores);
  const rankOf = id => ranked.findIndex(x=>x.a.id===id);

  const wedges = QUADRANTS.map((q,qi)=>{
    const a0 = -90 + qi*90 - 15, a1 = a0 + 90;
    const [lx,ly] = pt(QR*0.60, a0+45);
    const words = q.n.split(" ");
    return `<path d="${seg(0,QR,a0+0.6,a1-0.6)}" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
      <text x="${lx}" y="${ly}" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,0.62)" letter-spacing="0.4">
        <tspan x="${lx}" dy="-3">${esc(words[0]).toUpperCase()}</tspan>
        <tspan x="${lx}" dy="11">${esc(words.slice(1).join(" ")).toUpperCase()}</tspan>
      </text>`;
  }).join("");

  const segs = ARCHETYPES.map((a,i)=>{
    const a0 = -90 + i*30 - 15, a1 = a0 + 30;
    const v = scores[a.id]||0;
    const rk = rankOf(a.id);
    const outer = R0 + (maxScore>0 ? (v/maxScore) : 0) * (RMAX-R0);
    const r1 = Math.max(outer, R0+7);
    let fill = "rgba(255,255,255,0.08)", stroke="rgba(255,255,255,0.14)", sw=1;
    if(v>0){
      if(rk===0){ fill="#00fff6"; stroke="#00fff6"; sw=0; }
      else if(rk===1){ fill="rgba(81,176,210,0.92)"; stroke="rgba(81,176,210,0.92)"; sw=0; }
      else { fill="rgba(81,176,210,"+(0.20+0.42*(v/maxScore)).toFixed(2)+")"; stroke="rgba(141,204,226,0.35)"; }
    }
    const mid = a0+15;
    const [lx,ly] = pt(LR, mid);
    const c = Math.cos(rad(mid));
    const anchor = c>0.34 ? "start" : (c<-0.34 ? "end" : "middle");
    const dy = Math.sin(rad(mid))>0.9 ? 12 : (Math.sin(rad(mid))<-0.9 ? -4 : 4);
    const lc = rk===0 && v>0 ? "#00fff6" : (v>0 ? "#ffffff" : "rgba(255,255,255,0.42)");
    const lw = rk<2 && v>0 ? 700 : 600;
    return `<path d="${seg(R0,r1,a0+1.1,a1-1.1)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
      <text x="${lx}" y="${+ly+dy}" text-anchor="${anchor}" font-size="11.5" font-weight="${lw}" fill="${lc}" letter-spacing="0.5">${esc(a.s).toUpperCase()}</text>
      <text x="${lx}" y="${+ly+dy+13}" text-anchor="${anchor}" font-size="9.5" font-weight="500" fill="rgba(255,255,255,0.45)">${esc(a.drv)}</text>`;
  }).join("");

  return `<svg viewBox="0 0 560 505" width="100%" style="max-width:560px;display:block;margin:0 auto" role="img"
    aria-label="Boatyard brand archetype wheel, weighted by team votes">
    <circle cx="${CX}" cy="${CY}" r="${RMAX}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <circle cx="${CX}" cy="${CY}" r="${R0-4}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    ${wedges}${segs}
  </svg>`;
}


/* ============================== NARRATIVE ============================== */
function narrative(){
  const n = all.length;
  const aw = archScores(), rk = topOf(aw,"score");
  const A1 = rk[0].a, A2 = rk[1] && rk[1].v>0 ? rk[1].a : null;
  const primShare = Math.round(all.filter(r=>r.arch1===A1.id).length / n * 100);

  const dm = {}; DIALS.forEach(d=>{ dm[d.id]=mean(all.map(r=>r.dials?r.dials[d.id]:null).filter(v=>typeof v==="number")); });
  const tm = {}; TONE.forEach(t=>{ tm[t.id]=mean(all.map(r=>r.tone?r.tone[t.id]:null).filter(v=>typeof v==="number")); });

  const counts = {}; all.forEach(r=>(r.adjectives||[]).forEach(a=>counts[a]=(counts[a]||0)+1));
  const words = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);

  const v1 = band(tm.t1||3, [[2,"humour isn't part of the job"],[2.7,"mostly straight-faced"],[3.4,"good for a dry smile, never a punchline"],[4.1,"genuinely warm and funny"],[5,"wit is a signature, not a garnish"]]);
  const v2 = band(tm.t2||3, [[2,"formal"],[2.7,"professional and buttoned-up"],[3.4,"professional but relaxed"],[4.1,"conversational"],[5,"properly casual"]]);
  const v3 = band(tm.t3||3, [[2.6,"We stay respectful."],[3.4,"We're respectful, with an edge when it's earned."],[5,"We're willing to be irreverent."]]);
  const v4 = band(tm.t4||3, [[2,"matter-of-fact"],[2.7,"measured"],[3.4,"even-handed"],[4.1,"warm"],[5,"openly enthusiastic"]]);

  const p7 = band(dm.d7||4, [[3,"a marine specialist, first and last"],[5,"a marine specialist that happens to run the whole business"],[7,"an operations platform that happens to be marine"]]);
  const p5 = band(dm.d5||4, [[3,"built for the dock"],[5,"at home on the dock and in the back office"],[7,"built for the boardroom"]]);
  const p9 = band(dm.d9||4, [[3,"a tool that gets out of the way"],[5,"a tool that speaks up when it matters"],[7,"a partner that advises and pushes"]]);
  const p8 = band(dm.d8||4, [[3,"We're content to be the best version of what already exists."],[5,"We're here to improve the category, not overturn it."],[7,"We're here to define the category."]]);
  const p2 = band(dm.d2||4, [[3,"priced and built for practicality"],[5,"worth the money without being precious"],[7,"unapologetically premium"]]);

  const pair = all.map(r=>(r.isnot||[]).find(p=>p.is&&p.no)).find(Boolean);
  const never = all.map(r=>r.never).filter(x=>x&&x.trim())[0];

  return {A1, A2, primShare, words, paras:[
    `Boatyard is <b>${A1.n}</b>. ${A1.d} ${primShare}% of the team named ${A1.s} as our primary story${A2?`, with <b>${A2.n}</b> running underneath it`:""}. The traits that come with it — ${A1.tr} — are the ones our work should keep proving.`,
    words.length ? `Asked for five words, the team reached most often for <b>${words.map(esc).join("</b>, <b>")}</b>. That's the character ${art(A1.s)} shows up as in practice: not an abstract value on a wall, but the thing a technician notices at 7am when a part is missing.` : "",
    `We sound ${v2}, ${v4}, and we're ${v1}. ${v3}`,
    `We're ${p7} — ${p5}, ${p2}, and ${p9}. ${p8}`,
    pair ? `In the team's own words: we are <b>${esc(pair.is)}</b>, but never <span class="strike">${esc(pair.no)}</span>.` : "",
    never ? `And the line no one wants to cross: <em>${esc(never)}</em>` : ""
  ].filter(Boolean)};
}


/* ============================== RENDER: STORY ============================== */

  const totalBrandPicks = Object.values(bs).reduce((a,b)=>a+b,0);

  const writeIns = all.map(r=>r.brandOther).filter(x=>x&&x.trim());

  return `

    <p>${A1.d}</p>
  </div>

  <div class="story-panel">
    <h3 class="panel-h">Where the team lands on the wheel</h3>
    <p class="panel-sub">Each spoke grows with the weight of the vote — primary choices count double. The four inner segments are the underlying human motivations each family of archetypes serves.</p>
    ${wheelSVG(scoreMap, maxScore)}
    <div class="wheel-key">
      <span><i class="sw teal"></i>Strongest</span>
      <span><i class="sw blue"></i>Runner-up</span>
      <span><i class="sw faint"></i>Also in play</span>
    </div>

  <div class="card narrative">

  ${tension ? `<div class="tension">
    <div class="label" style="color:var(--warning)">A useful contradiction</div>
    <div class="vs">

  <div class="card">

  </div>

  ${dyn}

  <div class="card">

      <div><b>Consolidate the product and document type on DM Sans.</b>

    </div>
    <div class="rec">

      <p>Presentation covers, website heroes, campaign headlines, section dividers. Something condensed and squared that rhymes with the wordmark, so the identity gets its boldness back somewhere other than the logo. <strong>Space Grotesk</strong> and <strong>Sora</strong> are the closest in spirit; <strong>Archivo</strong> gives you a width axis if you want genuinely compressed headlines. Cap it at display sizes — never in the app, never in a table.</p></div>
    </div>
    <div class="rec">
      <div class="rec-n">3</div>
      <div><b>If you'd rather stay on one face entirely, choose DM Sans and get the boldness elsewhere.</b>
      <p>Weight contrast, scale contrast, generous negative space, the dark-blue gradient and teal accent. A minimal system can absolutely read as bold — but it has to come from somewhere, and right now the wordmark is carrying it alone.</p></div>
    </div>
  </div>

  <div class="card">
    <h3 class="h-sec">Voice &amp; tone — the part type can't fix</h3>
    <p class="note" style="margin:8px 0 16px">Typography sets expectation; copy either honours it or breaks it. Four working principles, each with what it means for type.</p>
    ${[
      {h:"Direct, not curt", b:"Say the thing. “Waiting for Parts”, not “This job is currently pending the arrival of components”. Directness is a courtesy to someone reading on a phone with wet hands.", t:"Short strings need generous size and weight, not decoration. Set UI labels at 12–14px semibold rather than 11px regular."},
      {h:"Marine-literate, never jargon-drunk", b:"Hull, gel coat, HIN, winterization — use them plainly. Explaining them insults the reader; hiding behind them excludes them.", t:"Domain words are often long and unfamiliar. Favour a face with open apertures and clear letter differentiation so unfamiliar strings stay readable."},
      {h:"Warm at the edges, neutral in the middle", b:"Greetings and empty states can be human (“You're All Caught Up!”). Transactional confirmations and alerts should have no personality at all.", t:"This argues for a neutral text face. Warmth should come from copy that can be edited, not from letterforms that can't."},
      {h:"Confident enough to be plain", b:"Boatyard doesn't need to sound clever. The product is the argument. Cut adverbs, cut hedging, cut “seamlessly”.", t:"Plain voice, plain type. Distinctiveness belongs in the display face and the palette, not in the interface."}
    ].map(v=>`<div class="vt">
      <b>${esc(v.h)}</b>
      <p>${esc(v.b)}</p>
      <p class="vt-t"><span>Type implication</span> ${esc(v.t)}</p>
    </div>`).join("")}
  </div>

  <div class="card">
    <h3 class="h-sec">Before you commit</h3>
    <p class="note" style="margin:8px 0 14px">A typeface decision is cheap to make and expensive to reverse. Five things worth checking first.</p>
    <ol class="chk">
      <li><b>Set a real parts table at 12px.</b> Not lorem — an actual purchase order with part numbers, quantities and currency. Print it. Most typeface regrets are discovered at small sizes.</li>
      <li><b>Confirm tabular (monospaced) figures.</b> Currency columns must align. If a face lacks tabular numerals, every total in every estimate will wobble.</li>
      <li><b>Test the PDF pipeline end to end.</b> Generate an estimate with embedded fonts and check the output on a phone, not just on your monitor.</li>
      <li><b>Check the weight range you'll actually use.</b> Our rules require 600 for titles, 700 for stat numbers, 500 for body on dark. Verify all three are drawn well, not synthesised.</li>
      <li><b>Look at it in the dark gradient.</b> Light text on deep blue thickens optically. A face that looks right on white can look bloated on <code>gradients.dark-blue</code>.</li>

    <p class="note" style="margin-top:8px">The colour system, the minimal layout language, the dark-blue gradient with the teal accent, the tight print margins — all of it holds. This is a decision about one variable. The reason it's worth the attention is that type is the only brand element that appears on literally every surface, and right now it's the one saying two different things.</p>

function sampleData(){
  const teams=["Leadership","Sales","Product / Design","Engineering","Customer Success","Marketing","Operations","Leadership","Sales"];
  const a1=["sage","sage","hero","sage","everyman","hero","sage","ruler","hero"];
  const a2=["hero","everyman","sage","caregiver",null,"sage","magician","sage","everyman"];
  const bs=[["Apple","Stripe"],["Notion","Tesla"],["Garmin","Carhartt"],["Apple","Notion","Stripe"],
            ["Costco","Carhartt"],["Apple","Tesla"],["Garmin","John Deere"],["Notion","Apple"],["Yeti","Patagonia"]];
  const w=[["Reliable","Precise","Grounded","Practical","Seasoned"],["Reliable","Modern","Efficient","Precise","Innovative"],
           ["Reliable","Relentless","Practical","Grounded","Confident"],["Precise","Reliable","Meticulous","Modern","Straightforward"],
           ["Practical","Approachable","Grounded","Reliable","Human"],["Confident","Modern","Bold","Reliable","Efficient"],
           ["Precise","Seasoned","Reliable","Straightforward","Grounded"],["Authoritative","Precise","Premium","Reliable","Polished"],
           ["Relentless","Practical","Reliable","Confident","Rugged"]];
  const lines=["It just runs the yard \u2014 nothing falls through.","The only software my techs will actually open.",
    "It's like having a service manager who never forgets anything.","Finally, estimates that don't take an hour.",
    "It speaks boat. Everything else I've tried speaks generic.","They know the industry better than we do.",
    "It made us look professional overnight.","Honestly? It's the reason we stopped using paper.",
    "It's the boring one that works."];
  const nevers=["Generic SaaS filler \u2014 'seamlessly empower your workflow'","Condescending. Our users know boats better than we do.",
    "Cutesy. Nobody wants emoji in a work order.","Corporate and hedging.","Like a startup trying too hard to be clever.",
    "Salesy.","Overly technical for the sake of it.","Cold and transactional.","Loud."];
  const pairs=[["Expert","academic"],["Efficient","cold"],["Tough","aggressive"],["Precise","fussy"],["Friendly","chummy"],
    ["Confident","arrogant"],["Thorough","slow"],["Premium","precious"],["Direct","blunt"]];
  const out=[];
  for(let i=0;i<9;i++){
    const r={id:"s"+i, ts:Date.now()-i*86400000, name:["Cami","Alex","Jordan","Priya","Marcus","Dana","Tom","Renee","Sam"][i],
      team:teams[i], audience:["Marine business operators","Boat owners","Technicians","Mostly internal"][i%4],
      adjectives:w[i], dials:{}, tone:{}, arch1:a1[i], arch2:a2[i], brands:bs[i],
      brandOther:i===2?"West Marine":(i===6?"Yamaha":""),
      isnot:[{is:pairs[i][0],no:pairs[i][1]},{is:"",no:""}], oneLiner:lines[i], never:nevers[i]};
    const base=[5,3,5,5,3,5,2,5,4];
    DIALS.forEach((d,j)=>{ r.dials[d.id] = Math.max(1, Math.min(7, base[j] + ((i*5+j*3)%5) - 2)); });
    TONE.forEach((t,j)=>{ r.tone[t.id] = Math.max(1, Math.min(5, [2,3,2,3][j] + ((i+j*2)%3) - 1)); });
    out.push(r);
  }
  return out;
}

    ${showManage ? `
      <p class="note" style="margin:10px 0 14px">
        ${liveDelete ? "Deleting removes the row from your Google Sheet permanently \\u2014 useful for clearing out your own test submissions." : "You're viewing data that wasn't loaded live from the sheet (sample, pasted CSV, or codes), so nothing here can be deleted. Load from the sheet via \\u2699 to manage real responses."}
      </p>
      <div class="mlist">${rows}</div>
    ` : ""}
  </div>`;
}

async function deleteResponse(rowNum, idx){
  if(!confirm("Delete this response? It will be permanently removed from the sheet.")) return;
  try{
    const res = await fetch(CONFIG.endpoint, {
      method:"POST", redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action:"delete", key: CONFIG.key, row: rowNum })
    });
    const j = await res.json();
    if(j && j.ok){
      all.splice(idx, 1);
      render();
    } else {
      alert("Couldn't delete: " + (j && j.error ? j.error : "unknown error"));
    }
  }catch(e){
    alert("Couldn't reach the sheet. " + (e && e.message ? e.message : e));
  }
}



/* ---------- write a computed snapshot to the "Summary" tab ---------- */
function buildSnapshotRows(){
  const nar = narrative();
  const A1 = nar.A1, A2 = nar.A2;
  const rows = [
    ["Boatyard Brand Personality \u2014 Snapshot", ""],
    ["Generated", new Date().toString()],
    ["Responses", all.length],
    [""],
    ["ARCHETYPE", ""],
    ["Primary", A1.n + " (" + A1.drv + ")"],
    ["Secondary", A2 ? A2.n + " (" + A2.drv + ")" : ""],
    ["Consensus on primary", nar.primShare + "%"],
    [""],
    ["FIVE WORDS", ""]
  ];
  const counts = {}; all.forEach(r=>(r.adjectives||[]).forEach(a=>counts[a]=(counts[a]||0)+1));
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([w,c])=>{
    rows.push([w, Math.round(c/all.length*100)+"%"]);
  });
  rows.push([""]); rows.push(["CHARACTER & POSITION DIALS",""]);
  rows.push(["Dial","Mean","Std Dev","Agreement"]);
  DIALS.forEach(d=>{
    const v = all.map(r=>r.dials?r.dials[d.id]:null).filter(x=>typeof x==="number");
    if(!v.length) return;
    const m = mean(v), s = sd(v);
    const [,lab] = align(s,7);
    rows.push([d.l+" \u2194 "+d.r, m.toFixed(1), s.toFixed(1), lab]);
  });
  rows.push([""]); rows.push(["VOICE DIALS",""]);
  rows.push(["Dial","Mean","Std Dev","Agreement"]);
  TONE.forEach(t=>{
    const v = all.map(r=>r.tone?r.tone[t.id]:null).filter(x=>typeof x==="number");
    if(!v.length) return;
    const m = mean(v), s = sd(v);
    const [,lab] = align(s,5);
    rows.push([t.l+" \u2194 "+t.r, m.toFixed(1), s.toFixed(1), lab]);
  });
  rows.push([""]); rows.push(["THE CHARACTER, WRITTEN OUT",""]);
  nar.paras.forEach(p=>rows.push([p.replace(/<[^>]+>/g,""), ""]));
  return rows;
}

/* ============================== SHEET IMPORT ============================== */
const SHEET_ID = "1Dp0xWo7QmvnWeshiOV5QIHXbGgX00PcTx4s0q74hx08";
const SHEET_GID = "0";
const sheetCsvUrl = (id,gid) => `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}`;
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    } else {
      if(c === '"') q=true;
      else if(c === ","){ row.push(f); f=""; }
      else if(c === "\n"){ row.push(f); rows.push(row); row=[]; f=""; }
      else f+=c;
    }
  }
  if(f.length || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

/* --- column matching: distinctive keyword per field, order matters --- */
const DIAL_KEY = {d1:"traditional", d2:"premium", d3:"systematic", d4:"understated",
                  d5:"rugged", d6:"humble", d7:"specialist", d8:"defines", d9:"partner"};
const TONE_KEY = {t1:"funny", t2:"casual", t3:"irreverent", t4:"enthusiastic"};

function findCol(heads, tests, used){
  for(let i=0;i<heads.length;i++){
    if(used.has(i)) continue;
    const h = heads[i];
    if(tests.some(t => h.includes(t))){ used.add(i); return i; }
  }
  return -1;
}
function num(v, min, max){
  const m = String(v||"").match(/-?\d+(\.\d+)?/);
  if(!m) return null;
  const n = Math.round(parseFloat(m[0]));
  return (n>=min && n<=max) ? n : null;
}
function archFrom(v){
  const s = String(v||"").toLowerCase();
  const hit = ARCHETYPES.find(a => s.includes(a.id) || s.includes(a.s.toLowerCase()));
  return hit ? hit.id : null;
}
function splitList(v){
  return String(v||"").split(/[;,\|\n]/).map(x=>x.trim()).filter(Boolean);
}

function mapCSV(text){
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error("Needs a header row plus at least one response row.");
  return mapTable(rows[0], rows.slice(1));
}
function mapObjects(objs){
  if(!objs || !objs.length) throw new Error("No rows returned.");
  const heads = Object.keys(objs[0]);
  return mapTable(heads, objs.map(o=>heads.map(h=>o[h])));
}
function mapTable(headRow, dataRows){
  const heads = headRow.map(h=>String(h).toLowerCase().trim());
  const used = new Set();

  /* order matters — the more specific patterns claim their column first */
  const cNever  = findCol(heads,["never sound","never_sound","must never","never"],used);
  const cLiner  = findCol(heads,["one_liner","one liner","one sentence","describes boatyard","peer at the dock","describe"],used);
  const cNot1   = findCol(heads,["we_are_not_1","are not 1","but not 1","not ___ 1"],used);
  const cAre1   = findCol(heads,["we_are_1","we are 1","we are ___ 1"],used);
  const cNot2   = findCol(heads,["we_are_not_2","are not 2","but not 2"],used);
  const cAre2   = findCol(heads,["we_are_2","we are 2"],used);
  const cBOther = findCol(heads,["brand_other","other brand","brand not listed","not listed"],used);
  const cBrands = findCol(heads,["brands_like_us","brands that feel","feel like us","brands"],used);
  const cA2     = findCol(heads,["archetype_2","archetype 2","secondary"],used);
  const cA1     = findCol(heads,["archetype_1","archetype 1","primary","archetype"],used);
  const cAdj    = findCol(heads,["adjective","five words","5 words","words"],used);
  const cAud    = findCol(heads,["audience","spend the most time","who do you"],used);
  const cTeam   = findCol(heads,["team","department"],used);
  const cName   = findCol(heads,["your name","name"],used);

  const dialCols = {}; DIALS.forEach(d=>{ dialCols[d.id] = findCol(heads,[DIAL_KEY[d.id]],used); });
  const toneCols = {}; TONE.forEach(t=>{ toneCols[t.id] = findCol(heads,[TONE_KEY[t.id]],used); });

  const get = (r,i) => i>=0 ? String(r[i]==null?"":r[i]).trim() : "";
  const out = [];
  dataRows.forEach((r,n)=>{
    const rec = {
      id:"csv"+n, ts: Date.now()+n,
      name:get(r,cName), team:get(r,cTeam)||"Unspecified", audience:get(r,cAud),
      adjectives: splitList(get(r,cAdj)),
      dials:{}, tone:{},
      arch1: archFrom(get(r,cA1)), arch2: archFrom(get(r,cA2)),
      brands: splitList(get(r,cBrands)).filter(b=>BRANDS.some(x=>x.n.toLowerCase()===b.toLowerCase()))
                .map(b=>(BRANDS.find(x=>x.n.toLowerCase()===b.toLowerCase())||{}).n),
      brandOther:get(r,cBOther),
      isnot:[{is:get(r,cAre1),no:get(r,cNot1)},{is:get(r,cAre2),no:get(r,cNot2)}],
      oneLiner:get(r,cLiner), never:get(r,cNever)
    };
    DIALS.forEach(d=>{ const v=num(get(r,dialCols[d.id]),1,7); if(v!==null) rec.dials[d.id]=v; });
    TONE.forEach(t=>{ const v=num(get(r,toneCols[t.id]),1,5); if(v!==null) rec.tone[t.id]=v; });
    /* pass through any metadata columns (e.g. "_row", the live sheet's row number)
       untouched — they aren't survey fields, just plumbing for actions like delete */
    headRow.forEach((h,i)=>{ if(String(h).charAt(0)==="_") rec[h] = r[i]; });
    if(rec.arch1 || rec.adjectives.length || Object.keys(rec.dials).length) out.push(rec);
  });

  if(!out.length) throw new Error("Found rows, but none contained recognisable answers. Check the header row.");
  const matched = [cName,cTeam,cAdj,cA1].filter(x=>x>=0).length
    + Object.values(dialCols).filter(x=>x>=0).length
    + Object.values(toneCols).filter(x=>x>=0).length;
  return {rows: out, matched, total: 4 + DIALS.length + TONE.length};
}
/* ============================== LIVE SHEET LOADING ============================== */
/* No source picker: this page only ever reads from the configured Apps
   Script endpoint. It polls quietly in the background so it stays current
   without anyone needing to refresh the tab by hand. */

const POLL_MS = 20000;
let pollTimer = null;

async function loadRemote(silent){
  const btn = document.getElementById("remoteBtn");
  if(!silent){
    if(btn){ btn.disabled = true; btn.textContent = "Refreshing…"; }
    loading = true; render();
  }
  try{
    const res = await fetch(CONFIG.endpoint + "?key=" + encodeURIComponent(CONFIG.key), {redirect:"follow"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    if(j && j.error) throw new Error(j.error);
    const {rows} = mapObjects(j.rows || j);
    all = rows; loading = false; lastUpdated = Date.now();
    render();
  }catch(e){
    loading = false;
    render();
    if(!silent){
      alert("Couldn't reach the response sheet.\n\n" + (e && e.message ? e.message : e) +
        "\n\nCheck that Code.gs is deployed and the endpoint in this file is correct.");
    }
    /* fail silently on background polls — a transient network hiccup
       shouldn't interrupt whoever's reading the page */
  }
  if(btn){ btn.disabled = false; btn.textContent = "Refresh now"; }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => loadRemote(true), POLL_MS);
}

function timeAgo(ts){
  if(!ts) return "";
  const s = Math.round((Date.now() - ts) / 1000);
  if(s < 5) return "just now";
  if(s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  if(m < 60) return m + "m ago";
  const h = Math.round(m / 60);
  return h + "h ago";
}

function banner(){
  const label = lastUpdated ? "Live from Google Sheet · updated " + timeAgo(lastUpdated) : "Connecting to the response sheet…";
  return `<div class="livebar">
    <span class="live-dot"></span>
    <span>${esc(label)}</span>
    <span class="spacer"></span>
    <button class="btn btn-ghost btn-sm" id="remoteBtn" onclick="loadRemote(false)">Refresh now</button>
  </div>`;
}

/* ============================== ROOT ============================== */
function go(v){ view = v; render(); window.scrollTo(0,0); }
function render(){
  ["story","dash","design"].forEach(t=>{
    const el = document.getElementById("tab-"+t);
    if(el) el.classList.toggle("active", view===t);
  });
  const body = loading ? `<div class="card"><div class="empty"><div class="big">Loading…</div></div></div>`
    : (view==="dash" ? renderDash() : (view==="design" ? renderDesign() : renderStory()));
  document.getElementById("shell").innerHTML = banner() + body;
}
(async function init(){
  view = "story"; render();
  await loadRemote(false);
  startPolling();
})();
